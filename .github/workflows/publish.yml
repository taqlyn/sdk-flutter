# https://dart.dev/tools/pub/automated-publishing
#
# pub.dev Admin → Automated publishing:
#   Repository:  taqlyn/sdk-flutter
#   Tag pattern: v{{version}}
#   Environment: pub.dev  (optional; must match `with.environment` below)
#
# Create GitHub Environment `pub.dev` under Settings → Environments.
# Pub.dev rejects publishes that are not triggered by a matching git tag push.

name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # tag-pattern on pub.dev: 'v{{version}}'

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
